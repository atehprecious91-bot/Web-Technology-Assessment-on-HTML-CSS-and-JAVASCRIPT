<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1> Memory Match</h1>
    <p>Test your memory and find the matching pairs!</p>

    <div class="settings">
        <select id="level" onchange="startGame()">
            <option value="8">Easy</option>
            <option value="12">Medium</option>
            <option value="18">Hard</option>
        </select>
        <button onclick="startGame()">Restart</button>
    </div>

    <div class="info">
        <span>Moves: <b id="moves">0</b></span>
        <span>Time: <b id="time">0</b>s</span>
        <span>Pairs: <b id="pairs">0</b></span>
    </div>

    <div class="board" id="board"></div>
    <h2 id="message">Find all matching pairs!</h2>
</div>
<script src="script.js"></script>
</body>
</html>
